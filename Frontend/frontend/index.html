<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="description" content="GaiaCom — sicherer, föderierter Messenger für AstraeaOS" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://beta.gaiacom.de; media-src 'self' blob: https://beta.gaiacom.de; connect-src 'self' https://beta.gaiacom.de wss://beta.gaiacom.de; worker-src 'self' blob:; manifest-src 'self'; font-src 'self' data:" />

    <link rel="stylesheet" href="/startup.css" />
    <title>GaiaCom 2 — Secure Federated Messenger</title>

  <body>
    <div class="ambient-light">
      <div class="light-orb orb-purple"></div>
      <div class="light-orb orb-blue"></div>
    </div>
    <noscript>Sie müssen JavaScript aktivieren, um diese App auszuführen.</noscript>
    <div id="root">
      <main class="astraea-startup" role="status" aria-live="polite">
        <div class="astraea-startup__mark"><img src="/astraeaos-logo.svg" alt="AstraeaOS" /></div>
        <p class="astraea-startup__eyebrow">ASTRAEAOS // GAIA CELL</p>
        <h1>GaiaCom wird geschützt gestartet</h1>
        <p class="astraea-startup__copy">Lokale Schlüsselräume und Kommunikationsdienste werden initialisiert.</p>
        <div class="astraea-startup__track" aria-hidden="true"><span class="astraea-startup__progress"></span></div>
      </main>
    </div>
	<script type="module" src="/src/index.jsx"></script>
