# SonarCloud analysis scope for CI-based analysis (the token-authenticated scanner
# reads this file). SonarCloud Automatic Analysis currently ignores repo-side
# properties; the same exclusions and the New Code baseline must be configured in
# the project UI (Administration → Analysis Scope / New Code) when no scanner runs.
# Keep generated code, vendored WASM glue, data-only locale dictionaries and test
# fixtures out of the product quality model; they dominate duplication and produce
# secret-pattern false positives without describing shipped behavior.
sonar.projectKey=visiongaiatechnology_GaiaCom
sonar.organization=visiongaiatechnology
sonar.projectName=GaiaCom
sonar.projectVersion=3.0.2
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.min.js,\
  Frontend/frontend/src/utils/locales/**,\
  Frontend/frontend/src/sovereign/wasm/**,\
  SovereignCryptoWasm/**,\
  Android/native/**,\
  **/*_test.go,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/testdata/**,\
  Frontend/frontend/src/adversarial*.js,\
  Frontend/frontend/src/adversarial*.mjs,\
  docs/**,\
  **/*.md

sonar.cpd.exclusions=\
  Frontend/frontend/src/utils/locales/**,\
  **/*_test.go,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/testdata/**,\
  Frontend/frontend/src/adversarial*.js,\
  Frontend/frontend/src/adversarial*.mjs

sonar.coverage.exclusions=**/*
