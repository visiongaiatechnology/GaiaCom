# STATUS: DIAMANT VGT SUPREME
server {
    listen 80;
    server_name app.gaiacom.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.gaiacom.net;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/app.gaiacom.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gaiacom.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GaiaComTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 3m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    root /var/www/gaiacom;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://app.gaiacom.net; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'none'; report-uri /api/v1/public/csp-report;" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /.well-known/gaiacom/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /livez { proxy_pass http://127.0.0.1:8080; }
    location = /readyz { proxy_pass http://127.0.0.1:8080; }
    location = /metrics { return 404; }

    location / {
        try_files $uri /index.html;
    }
}
